<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>mask compare</title>
<style>
body{background:#FAF6F0;font-family:sans-serif;padding:20px}
.row{display:flex;flex-wrap:wrap;gap:20px;margin-bottom:30px}
.cell{display:flex;flex-direction:column;align-items:center}
img{border:1px solid #ccc;background:#fff;max-width:260px;max-height:260px}
label{font-size:13px;margin-top:6px}
h3{margin:10px 0}
</style></head>
<body>
<h3>RED</h3>
<div class="row">
  <div class="cell"><img src="mask-red-orig.png"><label>orig.png</label></div>
  <div class="cell"><img src="mask-red.png"><label>.png</label></div>
  <div class="cell"><img src="mask-red.jpg"><label>.jpg</label></div>
  <div class="cell"><img src="mask-red-ai.jpg"><label>ai.jpg</label></div>
</div>
<h3>GOLD</h3>
<div class="row">
  <div class="cell"><img src="mask-gold-orig.png"><label>orig.png</label></div>
  <div class="cell"><img src="mask-gold.png"><label>.png</label></div>
  <div class="cell"><img src="mask-gold.jpg"><label>.jpg</label></div>
  <div class="cell"><img src="mask-gold-ai.jpg"><label>ai.jpg</label></div>
</div>
</body>
</html>
